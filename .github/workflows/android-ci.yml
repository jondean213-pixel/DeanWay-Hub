name: QuietOS Android CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject real google-services.json (if repo secret present)
        # The repo keeps a PLACEHOLDER google-services.json committed so
        # public builds stay key-free. If Jon sets the FIREBASE_GOOGLE_SERVICES
        # repo secret (the real file contents, pasted once), CI swaps it in
        # for the build — the key never touches git history.
        run: |
          if [ -n "${{ secrets.FIREBASE_GOOGLE_SERVICES }}" ]; then
            printf '%s' "${{ secrets.FIREBASE_GOOGLE_SERVICES }}" > app/google-services.json
            echo "Injected real google-services.json from repo secret."
          else
            echo "No FIREBASE_GOOGLE_SERVICES secret — building with placeholder (cloud relay will report 'not configured')."
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare local Gemma wake-word engine
        run: |
          mkdir -p app/libs app/src/main/assets
          curl -L --fail --retry 3 -o app/libs/sherpa-onnx-1.13.8.aar https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar
          curl -L --fail --retry 3 -o /tmp/kws.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/kws-models/sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01.tar.bz2
          tar -xjf /tmp/kws.tar.bz2 -C /tmp
          MODEL=sherpa-onnx-kws-zipformer-gigaspeech-3.3M-2024-01-01
          mkdir -p app/src/main/assets/$MODEL
          cp /tmp/$MODEL/encoder-epoch-12-avg-2-chunk-16-left-64.int8.onnx app/src/main/assets/$MODEL/encoder-epoch-12-avg-2-chunk-16-left-64.onnx
          cp /tmp/$MODEL/decoder-epoch-12-avg-2-chunk-16-left-64.onnx app/src/main/assets/$MODEL/
          cp /tmp/$MODEL/joiner-epoch-12-avg-2-chunk-16-left-64.int8.onnx app/src/main/assets/$MODEL/joiner-epoch-12-avg-2-chunk-16-left-64.onnx
          cp /tmp/$MODEL/tokens.txt app/src/main/assets/$MODEL/
          cp /tmp/$MODEL/bpe.model app/src/main/assets/$MODEL/
          python -m pip install --quiet sherpa-onnx sentencepiece pypinyin
          printf 'GEMMA\n' > /tmp/keywords_raw.txt
          sherpa-onnx-cli text2token --tokens /tmp/$MODEL/tokens.txt --tokens-type bpe --bpe-model /tmp/$MODEL/bpe.model /tmp/keywords_raw.txt app/src/main/assets/$MODEL/keywords.txt
      - name: Unit tests (both flavors)
        run: gradle testMotorolaDebugUnitTest testPhoneBDebugUnitTest
      - name: Debug APKs (both flavors)
        run: gradle assembleMotorolaDebug assemblePhoneBDebug
      - name: Publish APKs as GitHub Release assets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="quietos-ci-${{ github.run_number }}"
          cp "app/build/outputs/apk/motorola/debug/app-motorola-debug.apk" "QuietOS-Alpha-0.1-CI${{ github.run_number }}-motorola.apk"
          cp "app/build/outputs/apk/phoneB/debug/app-phoneB-debug.apk" "QuietOS-Alpha-0.1-CI${{ github.run_number }}-phoneB.apk"
          gh release create "$TAG" \
            "QuietOS-Alpha-0.1-CI${{ github.run_number }}-motorola.apk" \
            "QuietOS-Alpha-0.1-CI${{ github.run_number }}-phoneB.apk" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "QuietOS Alpha 0.1 CI ${{ github.run_number }}" \
            --notes "Automated QuietOS debug APKs from CI run ${{ github.run_number }}. Source commit: ${{ github.sha }}. motorola = full build (Gemma AI); phoneB = relay build (no AI natives, 32-bit compatible)."
